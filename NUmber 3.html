<!DOCTYPE html>
<html>
<head><title>List Example</title></head>
<body>
  <h1>Unordered List</h1>
  <ul><li>Apple</li><li>Banana</li><li>Mango</li></ul>

  <h1>Ordered List</h1>
  <ol><li>First</li><li>Second</li><li>Third</li></ol>

  <h1>Description List</h1>
  <dl>
    <dt>PU</dt><dd>Presidency University</dd>
    <dt>PUPC</dt><dd>Presidency University Programming Club</dd>
  </dl>
</body>
</html>
